<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Microsoft YaHei, Segoe UI, sans-serif">

<defs>
  <linearGradient id="gPaper" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#faf6ee"/><stop offset="1" stop-color="#ece3d2"/>
  </linearGradient>
  <linearGradient id="gSilver" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fdfdfb"/><stop offset="0.5" stop-color="#e2ded5"/><stop offset="1" stop-color="#bfb9ab"/>
  </linearGradient>
  <linearGradient id="gTop" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d6d1c6"/>
  </linearGradient>
  <linearGradient id="gLeather" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#403c37"/><stop offset="1" stop-color="#1f1d1a"/>
  </linearGradient>
  <linearGradient id="gDial" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f0eee8"/><stop offset="1" stop-color="#b3ada0"/>
  </linearGradient>
  <radialGradient id="gGlass" cx="0.38" cy="0.32" r="0.8">
    <stop offset="0" stop-color="#9dc2de"/><stop offset="0.4" stop-color="#33566f"/><stop offset="1" stop-color="#0b1720"/>
  </radialGradient>
  <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6fb4ff"/><stop offset="1" stop-color="#d3edff"/>
  </linearGradient>
  <linearGradient id="gSunset" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ff6f43"/><stop offset="0.5" stop-color="#ffb74d"/><stop offset="1" stop-color="#5c6bc0"/>
  </linearGradient>
  <linearGradient id="gNight" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0a1230"/><stop offset="1" stop-color="#24386b"/>
  </linearGradient>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity="0.20"/>
  </filter>
  <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="blurLite"><feGaussianBlur stdDeviation="2.4"/></filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
    <path d="M0,0 L9,4 L0,8 Z" fill="#5c7a4a"/>
  </marker>
</defs>

<rect width="640" height="300" fill="url(#gPaper)"/>
<text x="320" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#2c2a24">夜景：手持 vs 三脚架</text>
<g filter="url(#soft)"><rect x="40" y="70" width="250" height="170" rx="10" fill="url(#gNight)"/></g><clipPath id="ht40"><rect x="40" y="70" width="250" height="170" rx="10"/></clipPath><g clip-path="url(#ht40)"><g filter="url(#blur)"><rect x="80" y="160" width="18" height="70" fill="#2a3a5a"/><circle cx="89.0" cy="170" r="6" fill="#ffd36b"/><rect x="130" y="140" width="14" height="70" fill="#2a3a5a"/><circle cx="137.0" cy="150" r="6" fill="#ffd36b"/><rect x="190" y="180" width="20" height="70" fill="#2a3a5a"/><circle cx="200.0" cy="190" r="6" fill="#ffd36b"/><rect x="240" y="155" width="16" height="70" fill="#2a3a5a"/><circle cx="248.0" cy="165" r="6" fill="#ffd36b"/></g></g><text x="165" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#2c2a24">手持 1/15</text><text x="165" y="282" text-anchor="middle" font-size="12" fill="#c0392b">易糊 · 噪点多</text><g filter="url(#soft)"><rect x="350" y="70" width="250" height="170" rx="10" fill="url(#gNight)"/></g><clipPath id="ht350"><rect x="350" y="70" width="250" height="170" rx="10"/></clipPath><g clip-path="url(#ht350)"><g><rect x="390" y="160" width="18" height="70" fill="#2a3a5a"/><circle cx="399.0" cy="170" r="6" fill="#ffd36b"/><rect x="440" y="140" width="14" height="70" fill="#2a3a5a"/><circle cx="447.0" cy="150" r="6" fill="#ffd36b"/><rect x="500" y="180" width="20" height="70" fill="#2a3a5a"/><circle cx="510.0" cy="190" r="6" fill="#ffd36b"/><rect x="550" y="155" width="16" height="70" fill="#2a3a5a"/><circle cx="558.0" cy="165" r="6" fill="#ffd36b"/></g></g><text x="475" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#2c2a24">三脚架 2 秒</text><text x="475" y="282" text-anchor="middle" font-size="12" fill="#5c7a4a">清晰 · 低噪</text>
</svg>
