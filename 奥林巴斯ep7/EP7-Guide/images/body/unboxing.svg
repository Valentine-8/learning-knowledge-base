<g transform="translate(360,250) scale(0.7)" filter="url(#soft)"><rect x="20" y="40" width="140" height="70" rx="10" fill="url(#gLeather)"/><rect x="20" y="40" width="140" height="14" rx="6" fill="#4a453d"/><rect x="150" y="34" width="18" height="82" rx="6" fill="#c9c3b5" stroke="#8a7f6e"/><ellipse cx="168" cy="75" rx="10" ry="41" fill="url(#gGlass)"/><ellipse cx="164" cy="60" rx="4" ry="10" fill="#ffffff" fill-opacity="0.4"/></g>
<g transform="translate(520,250) scale(0.7)" filter="url(#soft)"><rect x="10" y="46" width="150" height="58" rx="12" fill="url(#gLeather)"/><rect x="40" y="42" width="60" height="66" rx="6" fill="#332f2a"/><rect x="150" y="40" width="22" height="70" rx="6" fill="#c9c3b5" stroke="#8a7f6e"/><ellipse cx="172" cy="75" rx="12" ry="35" fill="url(#gGlass)"/><ellipse cx="168" cy="62" rx="5" ry="9" fill="#ffffff" fill-opacity="0.4"/></g>
</g>
<circle cx="46" cy="92" r="5" fill="#5c7a4a"/>
<text x="62" y="96" font-size="15" fill="#2c2a24">EP7 机身（银 / 白）</text>
