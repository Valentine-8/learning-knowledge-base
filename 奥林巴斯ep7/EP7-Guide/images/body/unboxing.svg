<text x="62" y="164" font-size="15" fill="#2c2a24">40-150mm R 长焦</text>
<circle cx="46" cy="194" r="5" fill="#5c7a4a"/>
<text x="62" y="198" font-size="15" fill="#2c2a24">BLS-50 电池 + F-5AC 充电器</text>
<circle cx="46" cy="228" r="5" fill="#5c7a4a"/>
