<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>事件修饰符</title>
        <!-- 引入vue-->
        <script type="text/javascript" src="../js/vue.js"></script>
        <style>
            *{
                margin-top: 20px;
            }
            .demo1{
                height: 50px;
                background-color: aquamarine;
            }
            .box1{
                padding: 5px;
                background-color: skyblue;
            }
            .box2{
                padding: 5px;
                background-color: orange;
            }
            .list{
                width: 200px;
                height: 200px;
                background-color: fuchsia;
                overflow: auto;
            }
            li{
                height: 100px;
            }
        </style>
    </head>

<body>
    <div id="root">
        <a href="https://www.baidu.com"  @click="showinfo2($event,66)">点我弹窗1</a>
        <!-- 阻止默认事件-->
        <a href="https://www.baidu.com"  @click.prevent="showinfo2($event,66)">点我弹窗2</a>
        <!-- 阻止冒泡 -->
        <div class="demo1" @click="showinfo2($event,66)">
            <button @click.stop="showinfo2($event,66)">点我弹窗3</button>
        </div>
         <!-- 只调用一次 -->
         <button @click.once="showinfo2($event,66)">点我弹窗4</button>
        <!-- 使用事件的捕获模式 -->
        <div class ="box1" @click.capture="showMsg('div11')">
            div1
            <div class ="box2" @click="showMsg('div21')">
                div2
            </div>
        </div>

        <div class ="box1" @click.self="showtarget">
            div3
            <div class ="box2" @click="showtarget">
                div4
            </div>
        </div>
        <ul class="list" @scroll ="demo">
            <li>1</li>
            <li>2</li>
            <li>3</li>
            <li>4</li>
        </ul>

        <ul class="list" @wheel ="demo">
            <li>1</li>
            <li>2</li>
            <li>3</li>
            <li>4</li>
        </ul>
    </div>


    <script type="text/javascript">
        //Vue.config.productionTip = false
        //创建实例
        const vm = new Vue({
            data:function(){  
                return {
                    name:'哈哈哈'
                }
            },
            methods:{
                showinfo(event){
                    alert(event)
                    console.log(event)
                },
                showinfo2(event,num){
                    alert(num)
                    console.log(event)
                },
                showMsg(msg){
                    //alert(num)
                    console.log(msg)
                },
                showtarget(e){
                    //alert(num)
                    console.log(e.target)
                },
                demo(){
                  // for (let index = 0; index < 10000; index++) {
                  //     console.log("demo...")                   
                  // }
                    console.log("要死了...")        
                }
            }
        })
        vm.$mount('#root')


    </script>
</body>
</html>
