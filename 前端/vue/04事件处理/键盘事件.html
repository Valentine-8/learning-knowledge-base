<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>键盘事件</title>
        <!-- 引入vue-->
        <script type="text/javascript" src="../js/vue.js"></script>
    </head>

<body>
    <div id="root">
    	<input type="text" placeholder="按下回车输入" @keydown.enter ="showinfo">
        <input type="text" placeholder="按下回车输入" @keydown.huiche ="showinfo">
        <br/>
        <input type="text" placeholder="按下大小写输入" @keydown.caps-lock ="showinfo">
        <br/>
        <input type="text" placeholder="按下ctrl输入" @keydown.ctrl ="showinfo">
    </div>
    <script type="text/javascript">
        //Vue.config.productionTip = false
        Vue.config.keyCodes.huiche = 13
        //创建实例
        const vm = new Vue({
            data:function(){  
                return {
                    
                }
            },
            methods:{
                showinfo(e){
                    console.log(e.target.value)
                }
            }
        })
        vm.$mount('#root')
    </script>
</body>
</html>
