<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title></title>
        <!-- 引入vue-->
        <script type="text/javascript" src="../js/vue.js"></script>
    </head>

<body>
    <div id="root">
    	<h1>大家一起{{name}}</h1>
        <button v-on:click="showinfo">点我弹窗</button>
        <button @click="showinfo2($event,66)">点我弹窗</button>
    </div>
    <script type="text/javascript">
        //Vue.config.productionTip = false
        //创建实例
        const vm = new Vue({
            data:function(){  
                return {
                    name:'哈哈哈'
                }
            },
            methods:{
                showinfo(event){
                    alert(event)
                    console.log(event)
                },
                showinfo2(event,num){
                    alert(num)
                    console.log(event)
                }
            }
        })
        vm.$mount('#root')


    </script>
</body>
</html>
