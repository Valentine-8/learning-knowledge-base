<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>
            计算属性
        </title>
        <!-- 引入vue-->

<body>

    <script type="text/javascript">
        //Vue.config.productionTip = false
        Vue.config.keyCodes.huiche = 13
        //创建实例
        const vm = new Vue({
            data:function(){  
                return {
                   lastname :'',

                }
            },
            methods:{
                showinfo(e){
                    console.log(e.target.value)
                }
            }
        })
        vm.$mount('#root')
    </script>
