<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Redirecting…</title>
  <script>
    // GitHub Pages SPA fallback for Docsify (project site)
    var segmentCount = 1;
    var l = window.location;
    var repo = "/learning-knowledge-base";
    l.replace(
      l.protocol +
        "//" +
        l.hostname +
        (l.port ? ":" + l.port : "") +
        repo +
        "/?/" +
        l.pathname
          .slice(repo.length + 1)
          .split("/")
          .slice(segmentCount)
          .join("/")
          .replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
    );
  </script>
</head>
<body></body>
</html>
