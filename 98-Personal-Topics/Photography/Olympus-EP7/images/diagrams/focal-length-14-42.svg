<rect width="640" height="270" fill="url(#gPaper)"/>
<text x="320" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#2c2a24">14-42mm 视角对比（等效 28-84mm）</text>
<g filter="url(#soft)"><rect x="40" y="70" width="250" height="160" rx="8" fill="url(#gSky)"/></g><clipPath id="clip4070"><rect x="40" y="70" width="250" height="160" rx="8"/></clipPath><g clip-path="url(#clip4070)"><rect x="40" y="179" width="250" height="51" fill="#7cae4e"/><g><rect x="64" y="142" width="10" height="48" fill="#6b4f2a"/><circle cx="69" cy="142" r="22" fill="#5c8a3a"/><rect x="250" y="142" width="10" height="48" fill="#6b4f2a"/><circle cx="255" cy="142" r="22" fill="#5c8a3a"/></g><circle cx="165" cy="119" r="13" fill="#e6b98f"/><rect x="152" y="132" width="26" height="47" rx="8" fill="#c0392b"/></g><text x="165" y="254" text-anchor="middle" font-size="14" fill="#2c2a24">14mm 广角 · 容纳环境</text><g filter="url(#soft)"><rect x="350" y="70" width="250" height="160" rx="8" fill="url(#gSky)"/></g><clipPath id="clip35070"><rect x="350" y="70" width="250" height="160" rx="8"/></clipPath><g clip-path="url(#clip35070)"><rect x="350" y="179" width="250" height="51" fill="#7cae4e"/><g><rect x="374" y="142" width="10" height="48" fill="#6b4f2a"/><circle cx="379" cy="142" r="22" fill="#5c8a3a"/><rect x="560" y="142" width="10" height="48" fill="#6b4f2a"/><circle cx="565" cy="142" r="22" fill="#5c8a3a"/></g><circle cx="475" cy="49" r="35" fill="#e6b98f"/><rect x="440" y="84" width="70" height="95" rx="21" fill="#c0392b"/></g><text x="475" y="254" text-anchor="middle" font-size="14" fill="#2c2a24">42mm · 更聚焦主体</text>
