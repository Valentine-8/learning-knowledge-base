<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>helloworld</title>
    <!-- 引入vue-->
    <script type="text/javascript" src="../js/vue.js"></script>
</head>

<body>
    <div id="root">
        <!--插值语法 --> 
        <h1> 插值语法</h1>
        <h3> hello {{name}}</h3>
        <hr/>
        <h1>指令语法</h1>
        <a v-bind:href="school.url">点我去搜{{school.name}}</a> <!-- 加了v-bind之后会把引号里当表达式用,用：也行 一般管标签属性-->
    </div>
    <script type="text/javascript">
        Vue.config.productionTip = false
        //创建实例
        new Vue({
            el:'#root',   //el用于指定当前Vue实例为哪个容器服务，值通常为css选择器字符串。
            data:{  //数据仅供el指定容器使用
                name:'messi',
                school:{
                    name:'赵晨宇',
                    url:'https://www.baidu.com'    
                }
            }
        })
    </script>
</body>
</html>
